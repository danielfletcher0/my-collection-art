# ─────────────────────────────────────────────────────────────────────────────
#  Your Nuvio folders. Each one gets two images that rebuild every night:
#     art/<category>/<slug>/cover.jpg   (2:3, poster-shaped folders)
#     art/<category>/<slug>/wide.jpg    (16:9, landscape folders)
#
#  To remove a folder: delete its line.  To add one: copy a line and change it.
#  To check what every folder matches on TMDB (no images):  python generate.py --check
# ─────────────────────────────────────────────────────────────────────────────
#
# A folder is:   - { slug: my-folder, title: My Folder, source: { ... } }
# Settings on a category (subtitle, design, source...) apply to all its folders unless a folder
# sets its own.
#
# SOURCE — which movies/shows the art is built from. Use names; they're looked up on TMDB.
#   media:        movie | tv | both (default both)
#   genres:       [Crime, Thriller]          must have ALL of these genres
#   any_genres:   [Action, Thriller]         ANY of these genres
#   keywords:     [heist, bank robbery]      ANY of these TMDB keywords
#   all_keywords: [anime, sports]            ALL of these keywords
#   companies:    [Pixar, A24]               studios (any)
#   networks:     [HBO]                      TV networks (any)
#   providers:    [Netflix]                  streaming services (any), in `region` (default US)
#   countries:    [KR, JP]                   country of origin (any)
#   language:     ja                         original language
#   years:        [1980, 1989]               release years
#   recent_days:  90                         released in the last N days
#   sort:         popularity | rating | revenue
#   min_votes:    300                        skip obscure titles (TV needs a third of this)
#   A name like "HBO Max | Max" means "the first of these TMDB knows".
#
#   Other source types:
#     { type: network }                    the folder's title is the network (also: provider, company, keyword, genre)
#     { type: trending, media: movie }     TMDB trending this week
#     { type: person, name: Greta Gerwig, role: directing }
#     { type: titles, items: ["movie/603", "tv/1399"] }
#     { type: simkl, status: plantowatch, media: anime }   one of your Simkl lists
#
# DESIGN — backdrop | spotlight | fan | mosaic
# OTHER  — subtitle, accent ("#E53935"), style (bottom | center), pool (titles to rotate through),
#          rotate (true/false; Simkl lists default to most-recent-first)

settings:
  min_votes: 300
  region: US            # for streaming services
  language: en-US
  design: backdrop
  workers: 6

categories:

  # ── Your Simkl lists ──────────────────────────────────────────────────────
