    subtitle: Simkl
    folders:
      - { slug: continue-watching,   title: Continue Watching,   design: fan,    source: { type: simkl, status: watching } }
      - { slug: plan-to-watch,       title: Plan to Watch,       design: mosaic, source: { type: simkl, status: plantowatch, media: both } }
      - { slug: anime-plan-to-watch, title: Anime Watchlist,     design: mosaic, source: { type: simkl, status: plantowatch, media: anime } }

